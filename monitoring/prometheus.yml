global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sovereignstack'
    environment: 'production'

scrape_configs:
  # SovereignStack gateway — runs with host networking; reach it via the
  # host.docker.internal alias injected by the extra_hosts compose setting.
  - job_name: 'gateway'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: '/metrics'

  # Node-exporter — reachable by compose service name on the shared network
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'host-system'

  # cAdvisor — reachable by compose service name
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-metrics'

  # Model-container metrics via gateway HTTP SD.
  # The gateway exposes GET /api/v1/prometheus/targets which returns the list
  # of currently running model backends (port per model). Prometheus refreshes
  # this list every 30s so new models are scraped automatically without
  # reloading prometheus.yml. Each target gets a "model" label for easy
  # filtering in Grafana.
  - job_name: 'model-metrics'
    scrape_interval: 15s
    metrics_path: '/metrics'
    http_sd_configs:
      - url: 'http://host.docker.internal:8001/api/v1/prometheus/targets'
        refresh_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']