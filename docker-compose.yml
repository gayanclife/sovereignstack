# =============================================================================
# SovereignStack — full OSS stack as containers
# =============================================================================
#
# Brings up:
#   gateway        :8001  request hot path
#   policy         :8888  user / quota / access REST API (admin-auth)
#   discovery      :8889  running-models inventory (read-only)
#   metrics-proxy  :8890  vLLM /metrics by model name (read-only)
#   prometheus     :9090, grafana :3001, node-exporter :9100, cAdvisor :8080
#
# Model (vLLM / llama.cpp) containers are NOT started here — they are
# launched on demand by `sovstack deploy <model>`, which talks to the
# Docker daemon directly. The discovery service enumerates them.
#
# Native (no-Docker) full-stack alternative: ./scripts/start-stack.sh
# Container-mode wrapper (this file + demo-user seeding + banner):
#   ./scripts/start-stack-docker.sh
# =============================================================================

# Anchors so the three management-side services don't drift on shared bits.
x-mgmt-base: &mgmt-base
  image: sovereignstack:latest
  user: "${USER_UID:-1000}:${USER_GID:-1000}"
  volumes:
    - ~/.sovereignstack:/data/.sovereignstack
  environment:
    - SOVEREIGNSTACK_LOG_DIR=/data/.sovereignstack/logs
    - SOVSTACK_INSECURE_HTTP=true
    - HOME=/data
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Policy (:8888) — user / quota / access REST API. Owns keys.json. Admin
  # Bearer required for mutations. The image is built here for all four
  # services that share it (only this one declares `build:`).
  # ---------------------------------------------------------------------------
  policy:
    <<: *mgmt-base
    build:
      context: .
      dockerfile: Dockerfile.management
    container_name: sovereignstack-policy
    command: ["policy", "--port", "8888", "--keys", "/data/.sovereignstack/keys.json"]
    ports:
      - "${POLICY_PORT:-8888}:8888"
    environment:
      - SOVEREIGNSTACK_LOG_DIR=/data/.sovereignstack/logs
      - SOVSTACK_INSECURE_HTTP=true
      - HOME=/data
      - SOVSTACK_ADMIN_KEY=${SOVSTACK_ADMIN_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Discovery (:8889) — lists running model containers via the Docker socket.
  # Read-only, no auth, no state. Adds the host's docker group GID so a
  # non-root user can talk to /var/run/docker.sock.
  # ---------------------------------------------------------------------------
  discovery:
    <<: *mgmt-base
    container_name: sovereignstack-discovery
    command: ["discovery", "--port", "8889"]
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "${DISCOVERY_PORT:-8889}:8889"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.sovereignstack:/data/.sovereignstack
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8889/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Metrics-proxy (:8890) — proxies vLLM /metrics by model name. Read-only,
  # no auth, no state. Designed to be the high-traffic Prometheus scrape
  # target. Needs the docker socket only because it shells out to discover
  # the {name} → port mapping; same group_add as discovery.
  # ---------------------------------------------------------------------------
  metrics-proxy:
    <<: *mgmt-base
    container_name: sovereignstack-metrics-proxy
    command: ["metrics-proxy", "--port", "8890"]
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "${METRICS_PROXY_PORT:-8890}:8890"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.sovereignstack:/data/.sovereignstack
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8890/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Gateway (:8001) — request hot path. Auth → access → quota → rate-limit →
  # routing → reverse-proxy to model containers → metrics → audit.
  #
  # Uses host networking so the gateway can reach vLLM containers that
  # `sovstack deploy` published on host ports 8000+ (Linux-only escape hatch).
  # On Docker Desktop, replace with the bridge network and target
  # host.docker.internal:8000+ explicitly.
  # ---------------------------------------------------------------------------
  gateway:
    image: sovereignstack:latest
    container_name: sovereignstack-gateway
    command: [
      "gateway",
      "--port", "8001",
      "--keys", "/data/.sovereignstack/keys.json",
      "--discovery-url", "http://localhost:8889",
      "--audit-db", "/data/.sovereignstack/sovstack-audit.db",
    ]
    # Same host-user mapping as the policy / discovery / metrics-proxy
    # services — writes to the bind-mounted ~/.sovereignstack (audit DB,
    # keys.json read) stay host-owned.
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    network_mode: host
    volumes:
      - ~/.sovereignstack:/data/.sovereignstack
    environment:
      - SOVEREIGNSTACK_LOG_DIR=/data/.sovereignstack/logs
      - SOVSTACK_INSECURE_HTTP=true
      - SOVSTACK_AUDIT_KEY=${SOVSTACK_AUDIT_KEY:-}
      - HOME=/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      # Gateway only needs discovery healthy to start (that's where it polls
      # for the running-models registry). Policy and metrics-proxy are
      # external-facing and the gateway doesn't talk to them.
      discovery:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional: a vLLM model container. Disabled by default — `sovstack deploy`
  # is the recommended path because it picks ports / quantization / GPU
  # mapping based on the registry. Uncomment and set MODEL_NAME + HF_TOKEN
  # to launch a single fixed model alongside the rest of the stack.
  # ---------------------------------------------------------------------------
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ~/.cache/huggingface:/root/.cache/huggingface
  #   environment:
  #     - CUDA_VISIBLE_DEVICES=0
  #     - HF_TOKEN=${HF_TOKEN}
  #   command: --model ${MODEL_NAME} --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   shm_size: 1g

  # ---------------------------------------------------------------------------
  # Monitoring stack (optional but useful) — host metrics, container metrics,
  # Prometheus storage, Grafana dashboards.
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sovereignstack-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sovereignstack-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    command:
      - '--port=8080'
      - '--housekeeping_interval=10s'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sovereignstack-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sovereignstack-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
