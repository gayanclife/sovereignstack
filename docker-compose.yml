# =============================================================================
# SovereignStack — full OSS stack as containers
# =============================================================================
#
# Brings up: management API (8888), gateway (8001), Prometheus (9090),
# Grafana (3001), node-exporter (9100), cAdvisor (8080).
#
# Model (vLLM / llama.cpp) containers are NOT started here — they are
# launched on demand by `sovstack deploy <model>`, which talks to the
# Docker daemon directly. The management service discovers them.
#
# Native (no-Docker) full-stack alternative: ./scripts/start-stack.sh
# Container-only management API alternative: ./scripts/start-management.sh
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Management API (8888) — control plane: discovers Docker model containers,
  # owns user/quota/access policy, proxies vLLM /metrics by name.
  # ---------------------------------------------------------------------------
  management:
    build:
      context: .
      dockerfile: Dockerfile.management
    image: sovereignstack:latest
    container_name: sovereignstack-management
    command: ["management", "--port", "8888", "--keys", "/root/.sovereignstack/keys.json"]
    ports:
      - "${MANAGEMENT_PORT:-8888}:8888"
    volumes:
      # Docker socket (read-only) — used to enumerate running model containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Keystore is the single source of truth for users; management WRITES it
      # when admin endpoints mutate user/quota/access.
      - ~/.sovereignstack:/root/.sovereignstack
    environment:
      - SOVEREIGNSTACK_LOG_DIR=/root/.sovereignstack/logs
      - SOVSTACK_ADMIN_KEY=${SOVSTACK_ADMIN_KEY:-}
      - SOVSTACK_INSECURE_HTTP=true   # compose mode is dev-friendly; flip for prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Gateway (8001) — request hot path. Auth → access → quota → rate-limit →
  # routing → reverse-proxy to model containers → metrics → audit.
  #
  # Uses host networking so the gateway can reach vLLM containers that
  # `sovstack deploy` published on host ports 8000+ (Linux-only escape hatch).
  # On Docker Desktop, replace with the bridge network and target
  # host.docker.internal:8000+ explicitly.
  # ---------------------------------------------------------------------------
  gateway:
    image: sovereignstack:latest
    container_name: sovereignstack-gateway
    command: [
      "gateway",
      "--port", "8001",
      "--keys", "/root/.sovereignstack/keys.json",
      "--management-url", "http://localhost:8888",
      "--audit-db", "/root/.sovereignstack/sovstack-audit.db",
    ]
    network_mode: host
    volumes:
      - ~/.sovereignstack:/root/.sovereignstack
    environment:
      - SOVEREIGNSTACK_LOG_DIR=/root/.sovereignstack/logs
      - SOVSTACK_INSECURE_HTTP=true
      - SOVSTACK_AUDIT_KEY=${SOVSTACK_AUDIT_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      management:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional: a vLLM model container. Disabled by default — `sovstack deploy`
  # is the recommended path because it picks ports / quantization / GPU
  # mapping based on the registry. Uncomment and set MODEL_NAME + HF_TOKEN
  # to launch a single fixed model alongside the rest of the stack.
  # ---------------------------------------------------------------------------
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ~/.cache/huggingface:/root/.cache/huggingface
  #   environment:
  #     - CUDA_VISIBLE_DEVICES=0
  #     - HF_TOKEN=${HF_TOKEN}
  #   command: --model ${MODEL_NAME} --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   shm_size: 1g

  # ---------------------------------------------------------------------------
  # Monitoring stack (optional but useful) — host metrics, container metrics,
  # Prometheus storage, Grafana dashboards.
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sovereignstack-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sovereignstack-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    command:
      - '--port=8080'
      - '--housekeeping_interval=10s'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sovereignstack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sovereignstack-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
